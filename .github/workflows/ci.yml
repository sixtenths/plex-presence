name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.22.3
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libegl1 xvfb
      - run: python -m unittest discover -s tests_public -v
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          if ((Get-FileHash $download).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw 'Compiler checksum mismatch' }
          $process = Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="' + $compiler + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          $compiler | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: python packaging/build.py
      - name: Smoke-test the packaged app
        run: python tests_public/smoke_bundle.py
      - name: Smoke-test native desktop window
        if: runner.os != 'Linux'
        run: python tests_public/smoke_native.py
      - name: Smoke-test Linux desktop window
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests_public/smoke_native.py
      - name: Test Windows installation and upgrade
        if: runner.os == 'Windows'
        run: python tests_public/smoke_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      - name: Publish native downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --title "Plex Presence $RELEASE_TAG" --notes "Download PlexPresence-Setup-windows-x64.exe for guided Windows installation with shortcuts and an uninstaller. Python and dependencies are bundled. Includes a native desktop settings window, built-in guide, background startup and tray controls, simple Discord desktop mode, and optional always-on mode. Configuration opens in the app, not a web browser. Other platforms: extract the matching archive. Builds are unsigned; see README for details." --verify-tag
