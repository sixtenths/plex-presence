name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.22.3
      - run: python -m unittest discover -s tests_public -v
      - run: python packaging/build.py
      - name: Smoke-test the packaged app
        run: python tests_public/smoke_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      - name: Publish native downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --title "Plex Presence $RELEASE_TAG" --notes "Experimental client-free Plex presence with a local setup GUI. Download the archive for your OS and architecture, extract it, and launch PlexPresence. See the README for Discord application setup, unsigned-build notes, and privacy details." --verify-tag
