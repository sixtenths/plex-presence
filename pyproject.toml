[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-presence"
version = "0.3.4"
description = "A native desktop app for sharing Plex playback on Discord, with optional headless operation"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "sixtenths"}]
dependencies = ["websocket-client>=1.8,<2", "pypresence>=4.6.2,<5", "PySide6-Essentials==6.7.3", "certifi>=2025.1.31; sys_platform == 'darwin'", "pystray>=0.19.5,<1; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/sixtenths/plex-presence"
Issues = "https://github.com/sixtenths/plex-presence/issues"

[project.scripts]
plex-presence = "plex_presence.__main__:main"

[tool.setuptools]
packages = ["plex_presence"]
include-package-data = false

[tool.setuptools.package-data]
plex_presence = ["web/*.html", "web/*.css", "web/*.js", "assets/*"]
