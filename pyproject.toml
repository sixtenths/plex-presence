[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-presence"
version = "0.1.1"
description = "A local setup GUI for sharing personal Plex playback on Discord without a desktop client"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "sixtenths"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/sixtenths/plex-presence"
Issues = "https://github.com/sixtenths/plex-presence/issues"

[project.scripts]
plex-presence = "plex_presence.__main__:main"

[tool.setuptools]
packages = ["plex_presence"]
include-package-data = false

[tool.setuptools.package-data]
plex_presence = ["web/*.html", "web/*.css", "web/*.js"]
